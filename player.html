<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- YouTube এমবেডের জন্য referrer পাঠানো বাধ্যতামূলক (না হলে Error 152/153) -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Waj-Mahafil Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #unmute {
      display: none; position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%);
      padding: 10px 18px; border: 0; border-radius: 24px; font-size: 15px;
      background: rgba(0,0,0,.75); color: #fff; cursor: pointer; z-index: 10;
      font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <button id="unmute" type="button">🔊 শব্দ চালু করুন</button>
  <script>
    // Waj-Mahafil অ্যাপের অফিসিয়াল YouTube IFrame প্লেয়ার পেজ।
    // ব্যবহার: player.html?v=<11 অক্ষরের ভিডিও আইডি>
    // অ্যাপ WebView-এ "YTBridge" JavaScript channel দেয়: 'ended' / 'error:<code>'
    function send(msg) {
      try {
        if (window.YTBridge && window.YTBridge.postMessage) window.YTBridge.postMessage(msg);
      } catch (e) {}
    }

    var params = new URLSearchParams(location.search);
    var videoId = params.get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
      send('error:2');   // YouTube-এর "invalid parameter" কোডের মতোই
    } else {
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      tag.onerror = function () { send('error:-2'); };
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function () {
      new YT.Player('player', {
        videoId: videoId,
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          controls: 1,
          fs: 1,
          origin: location.origin,
          widget_referrer: location.href
        },
        events: {
          onReady: function (e) {
            var p = e.target;
            p.playVideo();
            // কিছু WebView (iOS/macOS) শব্দসহ autoplay আটকায়। ১.৫ সেকেন্ডে চালু না হলে
            // নিঃশব্দে চালু করি (সব browser এটা অনুমোদন করে) আর "শব্দ চালু করুন" বাটন দেখাই।
            setTimeout(function () {
              var st = p.getPlayerState ? p.getPlayerState() : -1;
              if (st !== 1 && st !== 3) {           // PLAYING বা BUFFERING নয়
                p.mute();
                p.playVideo();
                var btn = document.getElementById('unmute');
                btn.style.display = 'block';
                btn.onclick = function () { p.unMute(); p.setVolume(100); btn.style.display = 'none'; };
                // ব্যবহারকারী YouTube-এর নিজস্ব 🔇 বাটনে শব্দ চালু করলেও আমাদের বাটন সরে যাবে
                var t = setInterval(function () {
                  if (p.isMuted && !p.isMuted()) { btn.style.display = 'none'; clearInterval(t); }
                }, 1000);
                send('muted-autoplay');
              }
            }, 1500);
          },
          onStateChange: function (e) {
            if (e.data === 0) send('ended');
          },
          onError: function (e) { send('error:' + e.data); }
        }
      });
    };
  </script>
</body>
</html>
