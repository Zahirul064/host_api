name: Update waz videos

on:
  schedule:
    # প্রতিদিন একবার (UTC 00:17 = বাংলাদেশ সকাল ৬:১৭)। GitHub কখনো দেরিতে চালায়;
    # স্ক্রিপ্ট ১৮০ দিনের উইন্ডো দেখে ও ডুপ্লিকেট আটকায়, তাই নির্দিষ্ট মিনিটের ওপর নির্ভর করে না।
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "কত দিন পেছনের ভিডিও খুঁজবে (সবচেয়ে বেশি দেখাগুলো থেকে)"
        required: false
        default: "180"
      max_new:
        description: "প্রতি ক্যাটাগরিতে সর্বোচ্চ নতুন ভিডিও"
        required: false
        default: "5"
      dry_run:
        description: "শুধু রিপোর্ট দেখাবে, ফাইল বদলাবে না"
        type: boolean
        default: false
      prune:
        description: "ডিলিট/প্রাইভেট হওয়া ভিডিও মুছবে (সতর্কতা)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (offline, no quota used)
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Fetch new videos
        id: fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          LOOKBACK: ${{ github.event.inputs.lookback_days || '180' }}
          MAX_NEW: ${{ github.event.inputs.max_new || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PRUNE: ${{ github.event.inputs.prune || 'false' }}
        run: |
          if [ -z "$YT_API_KEY" ]; then
            echo "::warning::YT_API_KEY secret এখনো সেট করা নেই — আজকের আপডেট স্কিপ (Settings → Secrets and variables → Actions)"
            echo "## ⏸️ আপডেট স্কিপ: YT_API_KEY secret নেই" >> "$GITHUB_STEP_SUMMARY"
            echo "code=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARGS=(--lookback-days "$LOOKBACK" --max-new "$MAX_NEW" --report-json run_report.json)
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$PRUNE" = "true" ] && ARGS+=(--prune)
          set +e
          python scripts/update_videos.py "${ARGS[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) ;;
            3) echo "::error::YouTube API key ভুল বা অনুমতি নেই — কিছু বদলানো হয়নি" ;;
            4) echo "::error::যাচাই ফেল — আসল JSON অক্ষত রাখা হয়েছে" ;;
            5) echo "::error::সব সার্চ ফেল — নেটওয়ার্ক/API সমস্যা" ;;
            *) echo "::error::স্ক্রিপ্ট ফেল (exit $code)" ;;
          esac
          if [ -f run_report.json ] && grep -q '"stopped_reason": "[^"]' run_report.json; then
            echo "::warning::YouTube quota শেষ — আংশিক ফল রাখা হয়েছে, বাকিটা কাল চলবে"
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit & push if changed
        if: steps.fetch.outputs.code == '0'
        run: |
          if git diff --quiet -- video_studio.json && [ -z "$(git status --porcelain -- video_meta.json)" ]; then
            echo "No changes"; exit 0
          fi
          python -c "import json;d=json.load(open('video_studio.json',encoding='utf-8'));assert list(d)==['itemType'] and len(d['itemType'])>100"
          git config user.name  "waz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_studio.json video_meta.json
          git commit -m "auto: update video_studio.json ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::push ব্যর্থ"; exit 1

      - name: Fail job on script error
        if: steps.fetch.outputs.code != '0' && steps.fetch.outputs.code != 'skip'
        run: exit 1
